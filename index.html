<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduWordle - Oud-Hollandsch Woordspel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@600;700;800&family=Fredoka:wght@400;600&display=swap');
        
        body {
            font-family: 'IM Fell English', Georgia, serif;
            touch-action: manipulation;
            background-color: #f5f0e6;
            background-image: radial-gradient(#10375c 0.5px, transparent 0.5px), radial-gradient(#10375c 0.5px, #f5f0e6 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-opacity: 0.05;
        }

        .title-font {
            font-family: 'Cinzel', serif;
        }

        .delft-tile {
            box-shadow: 2px 3px 0px #0b2238;
            border: 2px solid #10375c;
        }

        .tile {
            transition: transform 0.15s ease-in-out, background-color 0.5s ease, border-color 0.5s ease;
            backface-visibility: hidden;
            box-shadow: 2px 2px 4px rgba(16, 55, 92, 0.15);
        }

        .tile.pop {
            animation: pop 0.1s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .tile.flip {
            animation: flip 0.6s ease forwards;
        }

        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        
        /* Win Animation Styles */
        .tile.win-bounce {
            animation: winBounce 0.8s ease-in-out;
        }

        @keyframes winBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
    </style>
</head>
